<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- White border background -->
  <rect width="512" height="512" fill="white" rx="80" ry="80"/>
  
  <!-- Inner padding area with purple background -->
  <rect x="40" y="40" width="432" height="432" fill="white" rx="60" ry="60"/>
  
  <!-- Medical cross shape with rounded corners -->
  <g transform="translate(256, 256)">
    <!-- Vertical bar of cross -->
    <rect x="-20" y="-120" width="40" height="240" rx="20" ry="20" fill="#A855F7"/>
    <!-- Horizontal bar of cross -->
    <rect x="-120" y="-20" width="240" height="40" rx="20" ry="20" fill="#A855F7"/>
    
    <!-- Dog silhouette positioned in upper left of cross -->
    <g transform="translate(-60, -40) scale(0.8)" fill="white">
      <!-- Dog head -->
      <ellipse cx="0" cy="-30" rx="25" ry="22"/>
      <!-- Dog ears -->
      <ellipse cx="-18" cy="-45" rx="10" ry="18" transform="rotate(-15)"/>
      <ellipse cx="18" cy="-45" rx="10" ry="18" transform="rotate(15)"/>
      <!-- Dog snout -->
      <ellipse cx="0" cy="-15" rx="12" ry="10"/>
      <!-- Dog nose -->
      <ellipse cx="0" cy="-20" rx="4" ry="3" fill="#A855F7"/>
      <!-- Dog body -->
      <ellipse cx="0" cy="15" rx="30" ry="25"/>
      <!-- Dog legs -->
      <rect x="-22" y="35" width="8" height="18" rx="4"/>
      <rect x="-8" y="35" width="8" height="18" rx="4"/>
      <rect x="6" y="35" width="8" height="18" rx="4"/>
      <rect x="20" y="35" width="8" height="18" rx="4"/>
      <!-- Dog tail -->
      <ellipse cx="25" cy="8" rx="6" ry="15" transform="rotate(25)"/>
    </g>
    
    <!-- Cat silhouette positioned in lower right of cross -->
    <g transform="translate(50, 30) scale(0.7)" fill="white">
      <!-- Cat head -->
      <ellipse cx="0" cy="-25" rx="20" ry="18"/>
      <!-- Cat ears -->
      <polygon points="-15,-35 -8,-42 -5,-32" fill="white"/>
      <polygon points="15,-35 8,-42 5,-32" fill="white"/>
      <!-- Cat inner ears -->
      <polygon points="-12,-35 -10,-38 -8,-33" fill="#A855F7"/>
      <polygon points="12,-35 10,-38 8,-33" fill="#A855F7"/>
      <!-- Cat body -->
      <ellipse cx="0" cy="10" rx="22" ry="18"/>
      <!-- Cat legs -->
      <rect x="-18" y="25" width="6" height="15" rx="3"/>
      <rect x="-7" y="25" width="6" height="15" rx="3"/>
      <rect x="4" y="25" width="6" height="15" rx="3"/>
      <rect x="15" y="25" width="6" height="15" rx="3"/>
      <!-- Cat tail -->
      <path d="M 18 15 Q 32 8 28 -5 Q 25 -12 22 -8" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Cat eyes -->
      <ellipse cx="-6" cy="-28" rx="1.5" ry="3" fill="#A855F7"/>
      <ellipse cx="6" cy="-28" rx="1.5" ry="3" fill="#A855F7"/>
    </g>
  </g>
</svg>