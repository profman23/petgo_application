<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>VetsVan - العيادة البيطرية المتنقلة</title>
    <meta name="description" content="خدمة العيادة البيطرية المتنقلة - رعاية شاملة لحيواناتك الأليفة في منزلك" />
    <script>
        // Immediate redirect to avoid Vite middleware issues
        window.location.replace('/app');
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: Arial;">
        <h2>جاري التحويل إلى التطبيق...</h2>
        <p>Redirecting to app...</p>
        <script>
            // Fallback if redirect doesn't work
            setTimeout(() => {
                if (window.location.pathname === '/') {
                    window.location.href = '/app';
                }
            }, 1000);
        </script>
    </div>
</body>
</html>
