<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Full square background that extends beyond safe area -->
  <rect width="512" height="512" fill="#852085"/>
  
  <!-- Safe area content with padding (20% from edges as per maskable spec) -->
  <g transform="translate(256, 256) scale(0.6)">
    <!-- Medical Cross -->
    <g transform="scale(0.8)">
      <!-- Vertical bar of cross -->
      <rect x="-25" y="-100" width="50" height="200" rx="25" ry="25" fill="#A855F7"/>
      <!-- Horizontal bar of cross -->
      <rect x="-100" y="-25" width="200" height="50" rx="25" ry="25" fill="#A855F7"/>
    </g>
    
    <!-- Dog silhouette -->
    <g transform="translate(-40, 40) scale(0.5)" fill="white">
      <!-- Dog head -->
      <ellipse cx="0" cy="-40" rx="35" ry="30"/>
      <!-- Dog ears -->
      <ellipse cx="-25" cy="-60" rx="15" ry="25" transform="rotate(-20)"/>
      <ellipse cx="25" cy="-60" rx="15" ry="25" transform="rotate(20)"/>
      <!-- Dog snout -->
      <ellipse cx="0" cy="-20" rx="15" ry="12"/>
      <!-- Dog nose -->
      <ellipse cx="0" cy="-25" rx="5" ry="3" fill="#852085"/>
      <!-- Dog body -->
      <ellipse cx="0" cy="20" rx="40" ry="32"/>
      <!-- Dog legs -->
      <rect x="-30" y="45" width="12" height="25" rx="6"/>
      <rect x="-10" y="45" width="12" height="25" rx="6"/>
      <rect x="8" y="45" width="12" height="25" rx="6"/>
      <rect x="26" y="45" width="12" height="25" rx="6"/>
      <!-- Dog tail -->
      <ellipse cx="35" cy="10" rx="8" ry="20" transform="rotate(30)"/>
    </g>
    
    <!-- Cat silhouette -->
    <g transform="translate(40, 40) scale(0.4)" fill="white">
      <!-- Cat head -->
      <ellipse cx="0" cy="-30" rx="25" ry="22"/>
      <!-- Cat ears -->
      <polygon points="-20,-45 -10,-55 -5,-40" fill="white"/>
      <polygon points="20,-45 10,-55 5,-40" fill="white"/>
      <!-- Cat inner ears -->
      <polygon points="-15,-45 -12,-50 -10,-42" fill="#A855F7"/>
      <polygon points="15,-45 12,-50 10,-42" fill="#A855F7"/>
      <!-- Cat body -->
      <ellipse cx="0" cy="15" rx="30" ry="25"/>
      <!-- Cat legs -->
      <rect x="-25" y="35" width="8" height="20" rx="4"/>
      <rect x="-10" y="35" width="8" height="20" rx="4"/>
      <rect x="5" y="35" width="8" height="20" rx="4"/>
      <rect x="20" y="35" width="8" height="20" rx="4"/>
      <!-- Cat tail -->
      <path d="M 25 20 Q 45 10 40 -10 Q 35 -20 30 -15" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- Cat eyes -->
      <ellipse cx="-8" cy="-35" rx="2" ry="4" fill="#852085"/>
      <ellipse cx="8" cy="-35" rx="2" ry="4" fill="#852085"/>
    </g>
  </g>
  
  <!-- VetsVan text in safe area -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">VetsVan</text>
</svg>