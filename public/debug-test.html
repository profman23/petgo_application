<!DOCTYPE html>
<html>
<head>
    <title>VetsVan API Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; background: #f0f0f0; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 VetsVan API Debug Test</h1>
    <div id="status" class="status">Starting test...</div>
    <div id="results"></div>
    
    <script>
        async function testAPI() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            try {
                // Test login first
                statusDiv.innerHTML = '🔐 Testing login...';
                statusDiv.className = 'status';
                
                const loginResponse = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        identifier: 'profman23@gmail.com',
                        password: '123456'
                    })
                });
                
                const loginData = await loginResponse.json();
                
                if (!loginResponse.ok) {
                    throw new Error(`Login failed: ${JSON.stringify(loginData)}`);
                }
                
                const token = loginData.token;
                statusDiv.innerHTML = `✅ Login successful. Token: ${token.substring(0, 10)}...`;
                statusDiv.className = 'status success';
                
                // Test VetsVan availability
                statusDiv.innerHTML = '🚐 Testing VetsVan availability...';
                statusDiv.className = 'status';
                
                const apiResponse = await fetch('/api/vetsvan/availability?lat=24.7136&lon=46.6753', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                statusDiv.innerHTML = `📊 API Response Status: ${apiResponse.status}`;
                
                if (!apiResponse.ok) {
                    const errorText = await apiResponse.text();
                    throw new Error(`API Error ${apiResponse.status}: ${errorText}`);
                }
                
                const apiData = await apiResponse.json();
                
                statusDiv.innerHTML = '🎉 SUCCESS: Both login and API working perfectly!';
                statusDiv.className = 'status success';
                
                resultsDiv.innerHTML = `
                    <h3>✅ Test Results:</h3>
                    <p><strong>Login Status:</strong> ${loginResponse.status} ✅</p>
                    <p><strong>API Status:</strong> ${apiResponse.status} ✅</p>
                    <p><strong>VetsVan Count:</strong> ${apiData.length}</p>
                    <p><strong>First VetsVan:</strong> ${apiData[0]?.vetsvanCode}</p>
                    <p><strong>Data Size:</strong> ${JSON.stringify(apiData).length} characters</p>
                    <details>
                        <summary>View Full API Response</summary>
                        <pre>${JSON.stringify(apiData, null, 2)}</pre>
                    </details>
                `;
                
            } catch (error) {
                statusDiv.innerHTML = '❌ ERROR: ' + error.message;
                statusDiv.className = 'status error';
                resultsDiv.innerHTML = `
                    <h3>❌ Error Details:</h3>
                    <pre class="error">${error.stack || error.message}</pre>
                `;
            }
        }
        
        // Run test on page load
        testAPI();
        
        // Add refresh button
        document.addEventListener('DOMContentLoaded', function() {
            const refreshBtn = document.createElement('button');
            refreshBtn.textContent = '🔄 Run Test Again';
            refreshBtn.style.cssText = 'padding: 10px 20px; margin: 10px 0; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;';
            refreshBtn.onclick = () => {
                document.getElementById('results').innerHTML = '';
                testAPI();
            };
            document.body.insertBefore(refreshBtn, document.getElementById('results'));
        });
    </script>
</body>
</html>
