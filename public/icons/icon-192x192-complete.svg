<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#852085;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="24" fill="url(#bgGradient)"/>
  
  <!-- Complete VetsVan Logo - centered -->
  <g transform="translate(96, 96) scale(0.65)">
    <!-- Van Body -->
    <rect x="-60" y="-20" width="120" height="40" rx="6" fill="white" opacity="0.95"/>
    
    <!-- Van Front -->
    <rect x="-65" y="-15" width="8" height="30" rx="4" fill="white" opacity="0.9"/>
    
    <!-- Van Back -->
    <rect x="57" y="-15" width="8" height="30" rx="4" fill="white" opacity="0.9"/>
    
    <!-- VETS Text -->
    <text x="0" y="-8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
          text-anchor="middle" fill="#852085">VETS</text>
    
    <!-- VAN Text -->
    <text x="0" y="2" font-family="Arial, sans-serif" font-size="10" font-weight="bold" 
          text-anchor="middle" fill="#7c3aed">VAN</text>
    
    <!-- Pet Icons -->
    <circle cx="-30" cy="-3" r="4" fill="#852085"/>
    <circle cx="-30" cy="-4" r="2.5" fill="white"/>
    
    <circle cx="30" cy="-3" r="4" fill="#852085"/>
    <path d="M28 -4 L30 -6 L32 -4 L30.5 -1.5 L29.5 -1.5 Z" fill="white"/>
    
    <!-- Medical Cross -->
    <rect x="-2" y="8" width="4" height="8" fill="#852085"/>
    <rect x="-4" y="10" width="8" height="4" fill="#852085"/>
    
    <!-- Van wheels -->
    <circle cx="-40" cy="18" r="6" fill="#444" opacity="0.8"/>
    <circle cx="40" cy="18" r="6" fill="#444" opacity="0.8"/>
    <circle cx="-40" cy="18" r="3" fill="#666"/>
    <circle cx="40" cy="18" r="3" fill="#666"/>
  </g>
</svg>