<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone 3D Icon -->
  <defs>
    <linearGradient id="phone-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2"/>
      <stop offset="50%" style="stop-color:#357ABD"/>
      <stop offset="100%" style="stop-color:#1E5F99"/>
    </linearGradient>
    <filter id="phone-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Main Circle -->
  <circle cx="32" cy="30" r="26" fill="url(#phone-gradient)" filter="url(#phone-shadow)"/>
  
  <!-- Phone Body -->
  <rect x="23" y="16" width="18" height="28" rx="4" ry="4" fill="white"/>
  <rect x="24" y="19" width="16" height="20" rx="1" ry="1" fill="#2C3E50"/>
  
  <!-- Phone Screen Reflection -->
  <rect x="25" y="20" width="6" height="8" rx="1" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Phone Speaker -->
  <rect x="27" y="17" width="10" height="1" rx="0.5" fill="#BDC3C7"/>
  
  <!-- Phone Home Button -->
  <circle cx="32" cy="41.5" r="1.5" fill="#BDC3C7"/>
  
  <!-- Phone Icon Inside -->
  <path d="M29 26c-0.5 0-1 0.4-1 1v0.5c0 0.3 0.1 0.5 0.3 0.7l1.4 1.4c0.1 0.1 0.1 0.2 0 0.3l-0.7 1.4c-0.1 0.2-0.3 0.3-0.5 0.3h-0.5c-0.6 0-1 0.4-1 1s0.4 1 1 1h0.5c0.8 0 1.5-0.4 1.9-1.1l0.7-1.4c0.2-0.4 0.2-0.9-0.1-1.2l-1.4-1.4c-0.1-0.1-0.1-0.2 0-0.3l1.4-1.4c0.3-0.3 0.3-0.8 0.1-1.2l-0.7-1.4c-0.4-0.7-1.1-1.1-1.9-1.1h-0.5c-0.6 0-1 0.4-1 1s0.4 1 1 1h0.5c0.2 0 0.4 0.1 0.5 0.3l0.7 1.4c0.1 0.1 0.1 0.2 0 0.3l-1.4 1.4c-0.2 0.2-0.3 0.4-0.3 0.7z" fill="#E74C3C"/>
  
  <!-- Call Action Lines -->
  <path d="M35 25l2 2M37 23l2 2M35 29l2-2M37 31l2-2" stroke="#27AE60" stroke-width="0.8" stroke-linecap="round"/>
</svg>