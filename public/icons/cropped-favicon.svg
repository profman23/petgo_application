<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="380" viewBox="0 0 512 380">
  <!-- Light gray background like original -->
  <rect width="512" height="380" fill="#F5F5F5"/>
  
  <!-- Medical Cross with animals - copied from original image dimensions -->
  <g transform="translate(256, 190)">
    <!-- Purple medical cross - exact shape from original -->
    <rect x="-100" y="-90" width="200" height="45" rx="22" fill="#9C2A85"/>
    <rect x="-22" y="-140" width="44" height="130" rx="22" fill="#9C2A85"/>
    
    <!-- Dog silhouette on left -->
    <g fill="white" transform="translate(-50, -20)">
      <!-- Dog head -->
      <path d="M-15 -40 Q-25 -50 -30 -35 Q-35 -20 -25 -15 Q-20 -10 -15 -15 Q-10 -20 -5 -25 Q0 -30 -5 -40 Q-10 -45 -15 -40 Z"/>
      <!-- Dog ear -->
      <ellipse cx="-20" cy="-45" rx="6" ry="10"/>
      <!-- Dog body -->
      <ellipse cx="-15" cy="10" rx="12" ry="15"/>
      <!-- Dog legs -->
      <ellipse cx="-25" cy="25" rx="3" ry="10"/>
      <ellipse cx="-15" cy="27" rx="3" ry="8"/>
      <ellipse cx="-5" cy="25" rx="3" ry="10"/>
      <!-- Dog tail -->
      <path d="M0 15 Q5 10 10 20 Q15 25 10 30" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Cat silhouette on right -->
    <g fill="white" transform="translate(50, -20)">
      <!-- Cat head -->
      <ellipse cx="0" cy="-30" rx="12" ry="15"/>
      <!-- Cat pointed ears -->
      <path d="M-8 -40 L-3 -50 L2 -40 Z"/>
      <path d="M2 -40 L7 -50 L12 -40 Z"/>
      <!-- Cat body -->
      <ellipse cx="0" cy="10" rx="10" ry="12"/>
      <!-- Cat legs -->
      <ellipse cx="-8" cy="22" rx="2" ry="6"/>
      <ellipse cx="-3" cy="24" rx="2" ry="4"/>
      <ellipse cx="3" cy="24" rx="2" ry="4"/>
      <ellipse cx="8" cy="22" rx="2" ry="6"/>
      <!-- Cat curved tail -->
      <path d="M10 13 Q20 5 25 -5 Q27 -10 23 -7 Q15 0 10 5" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>