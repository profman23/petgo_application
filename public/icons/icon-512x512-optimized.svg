<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#852085;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGradient)"/>
  
  <!-- Complete VetsVan Logo - centered and properly sized -->
  <g transform="translate(256, 256) scale(1.28)">
    <!-- Van Body -->
    <rect x="-60" y="-20" width="120" height="40" rx="6" fill="white" opacity="0.95"/>
    
    <!-- Van Front -->
    <rect x="-66" y="-15" width="8" height="30" rx="4" fill="white" opacity="0.9"/>
    
    <!-- Van Back -->
    <rect x="58" y="-15" width="8" height="30" rx="4" fill="white" opacity="0.9"/>
    
    <!-- VETS Text -->
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
          text-anchor="middle" fill="#852085">VETS</text>
    
    <!-- VAN Text -->
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" font-weight="bold" 
          text-anchor="middle" fill="#7c3aed">VAN</text>
    
    <!-- Pet Icons -->
    <circle cx="-30" cy="0" r="4" fill="#852085"/>
    <circle cx="-30" cy="-1" r="2.5" fill="white"/>
    
    <circle cx="30" cy="0" r="4" fill="#852085"/>
    <path d="M28 -1 L30 -3 L32 -1 L30.5 2 L29.5 2 Z" fill="white"/>
    
    <!-- Medical Cross -->
    <rect x="-2" y="10" width="4" height="8" fill="#852085"/>
    <rect x="-4" y="12" width="8" height="4" fill="#852085"/>
    
    <!-- Van wheels -->
    <circle cx="-40" cy="20" r="5" fill="#444" opacity="0.8"/>
    <circle cx="40" cy="20" r="5" fill="#444" opacity="0.8"/>
    <circle cx="-40" cy="20" r="2.5" fill="#666"/>
    <circle cx="40" cy="20" r="2.5" fill="#666"/>
  </g>
</svg>