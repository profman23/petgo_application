<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Purple gradients matching the original image -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B83A9C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9C2A85;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A226B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Light gray background like original -->
  <rect width="512" height="512" fill="#F5F5F5"/>
  
  <!-- Medical Cross - exact shape from original image -->
  <g transform="translate(256, 256)">
    <!-- Vertical bar of cross -->
    <rect x="-45" y="-140" width="90" height="280" rx="45" fill="url(#purpleGradient)"/>
    <!-- Horizontal bar of cross -->
    <rect x="-140" y="-45" width="280" height="90" rx="45" fill="url(#purpleGradient)"/>
    
    <!-- Dog silhouette - matching original positioning and shape -->
    <g transform="translate(-15, -15)">
      <!-- Dog head outline -->
      <path d="M-25 -35 Q-35 -45 -40 -30 Q-45 -15 -35 -10 Q-30 -5 -25 -10 Q-20 -15 -15 -20 Q-10 -25 -15 -35 Q-20 -40 -25 -35 Z" fill="white" stroke="white" stroke-width="2"/>
      <!-- Dog ear -->
      <ellipse cx="-30" cy="-40" rx="8" ry="12" fill="white"/>
      <!-- Dog body -->
      <ellipse cx="-25" cy="5" rx="15" ry="18" fill="white"/>
      <!-- Dog front legs -->
      <ellipse cx="-35" cy="20" rx="4" ry="12" fill="white"/>
      <ellipse cx="-25" cy="22" rx="4" ry="10" fill="white"/>
      <!-- Dog back legs -->
      <ellipse cx="-15" cy="20" rx="4" ry="12" fill="white"/>
      <!-- Dog tail -->
      <path d="M-10 10 Q-5 5 0 15 Q5 20 0 25" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Cat silhouette - matching original positioning and shape -->
    <g transform="translate(15, -15)">
      <!-- Cat head -->
      <ellipse cx="25" cy="-25" rx="15" ry="18" fill="white"/>
      <!-- Cat pointed ears -->
      <path d="M15 -35 L20 -45 L25 -35 Z" fill="white"/>
      <path d="M25 -35 L30 -45 L35 -35 Z" fill="white"/>
      <!-- Cat body -->
      <ellipse cx="25" cy="5" rx="12" ry="15" fill="white"/>
      <!-- Cat legs -->
      <ellipse cx="15" cy="18" rx="3" ry="8" fill="white"/>
      <ellipse cx="22" cy="20" rx="3" ry="6" fill="white"/>
      <ellipse cx="28" cy="20" rx="3" ry="6" fill="white"/>
      <ellipse cx="35" cy="18" rx="3" ry="8" fill="white"/>
      <!-- Cat curved tail -->
      <path d="M35 8 Q45 0 50 -10 Q52 -15 48 -12 Q40 -5 35 0" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>