<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Purple gradient matching the theme -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9f4f96;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#852085;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a1b69;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- White background for better visibility -->
  <rect width="512" height="512" rx="64" fill="white"/>
  
  <!-- Medical Cross in center -->
  <g transform="translate(256, 256)">
    <!-- Vertical bar of cross -->
    <rect x="-30" y="-120" width="60" height="240" rx="30" fill="url(#purpleGradient)"/>
    <!-- Horizontal bar of cross -->
    <rect x="-120" y="-30" width="240" height="60" rx="30" fill="url(#purpleGradient)"/>
    
    <!-- Dog silhouette (left side) -->
    <g transform="translate(-80, 0) scale(1.2)">
      <!-- Dog head -->
      <ellipse cx="0" cy="-15" rx="20" ry="25" fill="white"/>
      <!-- Dog ears -->
      <ellipse cx="-15" cy="-25" rx="8" ry="15" fill="white"/>
      <ellipse cx="15" cy="-25" rx="8" ry="15" fill="white"/>
      <!-- Dog nose -->
      <circle cx="0" cy="-5" r="3" fill="white"/>
      <!-- Dog body -->
      <ellipse cx="0" cy="15" rx="18" ry="20" fill="white"/>
      <!-- Dog tail -->
      <path d="M15 20 Q25 15 20 5" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Cat silhouette (right side) -->
    <g transform="translate(80, 0) scale(1.2)">
      <!-- Cat head -->
      <ellipse cx="0" cy="-10" rx="18" ry="20" fill="white"/>
      <!-- Cat ears (pointed) -->
      <path d="M-12 -25 L-8 -35 L-4 -25 Z" fill="white"/>
      <path d="M4 -25 L8 -35 L12 -25 Z" fill="white"/>
      <!-- Cat nose -->
      <path d="M-2 -5 L0 -8 L2 -5 Z" fill="white"/>
      <!-- Cat body -->
      <ellipse cx="0" cy="15" rx="15" ry="18" fill="white"/>
      <!-- Cat tail (curved) -->
      <path d="M12 20 Q22 10 25 -5 Q22 -10 18 -5 Q15 5 10 15" fill="white"/>
    </g>
  </g>
</svg>