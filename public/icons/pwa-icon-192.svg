<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- White background with rounded corners -->
  <rect width="192" height="192" fill="white" rx="24" ry="24"/>
  
  <!-- White border frame (15px thick) -->
  <rect x="15" y="15" width="162" height="162" fill="white" stroke="#e5e7eb" stroke-width="3" rx="16" ry="16"/>
  
  <!-- Purple medical cross based on original image -->
  <g transform="translate(45, 45)">
    <!-- Medical Cross Shape - More accurate to original -->
    <path d="M36 0 L66 0 C72 0 78 6 78 12 L78 36 L102 36 C108 36 114 42 114 48 L114 66 C114 72 108 78 102 78 L78 78 L78 102 C78 108 72 114 66 114 L36 114 C30 114 24 108 24 102 L24 78 L12 78 C6 78 0 72 0 66 L0 48 C0 42 6 36 12 36 L24 36 L24 12 C24 6 30 0 36 0 Z" fill="#A855F7"/>
    
    <!-- Main animal group - recreating the original design -->
    <g fill="white">
      <!-- Large dog silhouette (top/back) -->
      <g transform="translate(25, 20)">
        <!-- Dog head -->
        <path d="M20 15 C25 10 35 10 40 15 C42 18 45 22 45 26 C45 30 42 34 38 36 C35 38 32 39 28 39 C24 39 21 38 18 36 C14 34 11 30 11 26 C11 22 14 18 16 15 C17 14 19 14 20 15 Z"/>
        
        <!-- Dog long ear -->
        <ellipse cx="15" cy="20" rx="5" ry="12" transform="rotate(-25 15 20)"/>
        
        <!-- Dog body -->
        <ellipse cx="28" cy="45" rx="18" ry="15"/>
        
        <!-- Dog legs -->
        <rect x="15" y="55" width="4" height="12" rx="2"/>
        <rect x="22" y="55" width="4" height="12" rx="2"/>
        <rect x="32" y="55" width="4" height="12" rx="2"/>
        <rect x="39" y="55" width="4" height="12" rx="2"/>
        
        <!-- Dog tail -->
        <path d="M10 40 Q5 35 3 45 Q1 50 8 48" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      
      <!-- Cat silhouette (smaller, in front) -->
      <g transform="translate(55, 35)">
        <!-- Cat head -->
        <ellipse cx="15" cy="12" rx="10" ry="8"/>
        
        <!-- Cat pointed ears -->
        <path d="M8 7 L10 0 L12 7 Z"/>
        <path d="M18 7 L20 0 L22 7 Z"/>
        
        <!-- Cat body (smaller and more compact) -->
        <ellipse cx="12" cy="25" rx="12" ry="10"/>
        
        <!-- Cat legs -->
        <rect x="5" y="32" width="3" height="8" rx="1.5"/>
        <rect x="10" y="32" width="3" height="8" rx="1.5"/>
        <rect x="15" y="32" width="3" height="8" rx="1.5"/>
        <rect x="20" y="32" width="3" height="8" rx="1.5"/>
        
        <!-- Cat curved tail -->
        <path d="M0 20 Q-5 15 -7 25 Q-5 30 0 27" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
      
      <!-- Medical stethoscope accent -->
      <g transform="translate(75, 75)">
        <circle cx="5" cy="5" r="4" stroke="white" stroke-width="1.5" fill="none"/>
        <path d="M5 9 Q10 12 18 15 Q22 17 25 15" stroke="white" stroke-width="1.5" fill="none"/>
        <circle cx="25" cy="15" r="2.5" fill="white"/>
      </g>
      
      <!-- Small medical cross detail -->
      <g transform="translate(80, 25)">
        <rect x="2" y="0" width="1.5" height="6" rx="0.5"/>
        <rect x="0" y="2.25" width="6" height="1.5" rx="0.5"/>
      </g>
    </g>
  </g>
</svg>