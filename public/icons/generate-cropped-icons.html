<!DOCTYPE html>
<html>
<head>
    <title>Generate VetsVan Cropped Icons</title>
</head>
<body>
    <canvas id="canvas" style="display: none;"></canvas>
    <div id="download-links"></div>

    <script>
        // Function to create cropped VetsVan icon
        function createCroppedIcon(size) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = size;
            canvas.height = size;
            
            // Clear canvas
            ctx.clearRect(0, 0, size, size);
            
            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#852085');
            gradient.addColorStop(0.5, '#a855f7');
            gradient.addColorStop(1, '#7c3aed');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Calculate scaling factor
            const scale = size / 512;
            
            // Create cropping effect by only drawing in center portion
            const cropWidth = size * 0.75; // 75% of width
            const cropX = (size - cropWidth) / 2;
            
            ctx.save();
            ctx.beginPath();
            ctx.rect(cropX, 0, cropWidth, size);
            ctx.clip();
            
            // Draw VetsVan logo (scaled)
            const logoScale = scale * 1.5;
            const offsetX = -32 * scale;
            const offsetY = 96 * scale;
            
            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(logoScale, logoScale);
            
            // Van body
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.fillRect(80, 160, 280, 120);
            
            // Van front and back
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fillRect(70, 170, 20, 100);
            ctx.fillRect(350, 170, 20, 100);
            
            // Text - VETS
            ctx.fillStyle = '#852085';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('VETS', 220, 210);
            
            // Text - VAN
            ctx.fillStyle = '#7c3aed';
            ctx.font = 'bold 28px Arial';
            ctx.fillText('VAN', 220, 240);
            
            // Pet icons
            ctx.fillStyle = '#852085';
            ctx.beginPath();
            ctx.arc(150, 190, 12, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(150, 185, 8, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.fillStyle = '#852085';
            ctx.beginPath();
            ctx.arc(290, 190, 12, 0, 2 * Math.PI);
            ctx.fill();
            
            // Medical cross
            ctx.fillStyle = '#852085';
            ctx.fillRect(215, 250, 10, 20);
            ctx.fillRect(210, 255, 20, 10);
            
            ctx.restore();
            ctx.restore();
            
            // Add shadow effect on sides
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, cropX, size);
            ctx.fillRect(size - cropX, 0, cropX, size);
            
            return canvas.toDataURL('image/png');
        }
        
        // Generate icons for all sizes
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const downloadLinks = document.getElementById('download-links');
        
        sizes.forEach(size => {
            const dataUrl = createCroppedIcon(size);
            
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = `icon-${size}x${size}-cropped.png`;
            link.textContent = `Download ${size}x${size} Icon`;
            link.style.display = 'block';
            link.style.margin = '10px';
            
            downloadLinks.appendChild(link);
        });
        
        console.log('Cropped VetsVan icons generated successfully!');
    </script>
</body>
</html>
