<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#852085;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGradient)"/>
  
  <!-- Complete VetsVan Logo - centered and properly sized -->
  <g transform="translate(256, 256) scale(1.2)">
    <!-- Van Body -->
    <rect x="-80" y="-25" width="160" height="50" rx="8" fill="white" opacity="0.95"/>
    
    <!-- Van Front -->
    <rect x="-88" y="-18" width="10" height="36" rx="5" fill="white" opacity="0.9"/>
    
    <!-- Van Back -->
    <rect x="78" y="-18" width="10" height="36" rx="5" fill="white" opacity="0.9"/>
    
    <!-- VETS Text -->
    <text x="0" y="-8" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
          text-anchor="middle" fill="#852085">VETS</text>
    
    <!-- VAN Text -->
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
          text-anchor="middle" fill="#7c3aed">VAN</text>
    
    <!-- Pet Icons -->
    <circle cx="-40" cy="-2" r="6" fill="#852085"/>
    <circle cx="-40" cy="-3" r="4" fill="white"/>
    
    <circle cx="40" cy="-2" r="6" fill="#852085"/>
    <path d="M37 -4 L40 -7 L43 -4 L41 0 L39 0 Z" fill="white"/>
    
    <!-- Medical Cross -->
    <rect x="-3" y="12" width="6" height="12" fill="#852085"/>
    <rect x="-6" y="15" width="12" height="6" fill="#852085"/>
    
    <!-- Van wheels -->
    <circle cx="-50" cy="28" r="8" fill="#444" opacity="0.8"/>
    <circle cx="50" cy="28" r="8" fill="#444" opacity="0.8"/>
    <circle cx="-50" cy="28" r="4" fill="#666"/>
    <circle cx="50" cy="28" r="4" fill="#666"/>
  </g>
</svg>