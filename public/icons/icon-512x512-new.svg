<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="512" height="512" fill="white" rx="64" ry="64"/>
  
  <!-- White border/frame -->
  <rect x="40" y="40" width="432" height="432" fill="white" stroke="white" stroke-width="40" rx="32" ry="32"/>
  
  <!-- Medical cross background in purple -->
  <g transform="translate(80, 80) scale(3.6)">
    <!-- Purple medical cross shape -->
    <path d="M36 0 L64 0 C70.6274 0 76 5.37258 76 12 L76 36 L100 36 C106.627 36 112 41.3726 112 48 L112 64 C112 70.6274 106.627 76 100 76 L76 76 L76 100 C76 106.627 70.6274 112 64 112 L36 112 C29.3726 112 24 106.627 24 100 L24 76 L12 76 C5.37258 76 0 70.6274 0 64 L0 48 C0 41.3726 5.37258 36 12 36 L24 36 L24 12 C24 5.37258 29.3726 0 36 0 Z" fill="#A855F7"/>
    
    <!-- Dog silhouette -->
    <g transform="translate(18, 20) scale(0.6)" fill="white">
      <path d="M85 45 C88 42 92 40 96 42 C98 38 100 35 102 38 C104 40 106 45 104 48 C102 50 100 52 98 50 C96 48 94 46 92 48 C90 50 88 52 86 50 C84 48 83 46 85 45 Z"/>
      <!-- Dog head -->
      <ellipse cx="75" cy="60" rx="20" ry="18" fill="white"/>
      <!-- Dog ear -->
      <ellipse cx="65" cy="50" rx="8" ry="12" fill="white" transform="rotate(-20 65 50)"/>
      <!-- Dog nose -->
      <circle cx="82" cy="58" r="2" fill="#A855F7"/>
      <!-- Dog body -->
      <ellipse cx="55" cy="85" rx="25" ry="20" fill="white"/>
      <!-- Dog legs -->
      <rect x="35" y="95" width="6" height="15" rx="3" fill="white"/>
      <rect x="45" y="95" width="6" height="15" rx="3" fill="white"/>
      <rect x="65" y="95" width="6" height="15" rx="3" fill="white"/>
      <rect x="75" y="95" width="6" height="15" rx="3" fill="white"/>
      <!-- Dog tail -->
      <path d="M25 80 Q20 75 22 85 Q24 90 28 85" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Cat silhouette -->
    <g transform="translate(45, 55) scale(0.5)" fill="white">
      <!-- Cat head -->
      <ellipse cx="40" cy="30" rx="15" ry="12" fill="white"/>
      <!-- Cat ears -->
      <path d="M28 20 L32 10 L36 20 Z" fill="white"/>
      <path d="M44 20 L48 10 L52 20 Z" fill="white"/>
      <!-- Cat nose -->
      <circle cx="40" cy="28" r="1.5" fill="#A855F7"/>
      <!-- Cat body -->
      <ellipse cx="35" cy="50" rx="18" ry="15" fill="white"/>
      <!-- Cat legs -->
      <rect x="22" y="58" width="4" height="12" rx="2" fill="white"/>
      <rect x="28" y="58" width="4" height="12" rx="2" fill="white"/>
      <rect x="40" y="58" width="4" height="12" rx="2" fill="white"/>
      <rect x="46" y="58" width="4" height="12" rx="2" fill="white"/>
      <!-- Cat tail -->
      <path d="M15 45 Q10 40 8 50 Q6 55 12 52" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Medical stethoscope -->
    <g transform="translate(65, 75) scale(0.4)" fill="white">
      <path d="M20 10 Q15 5 10 10 Q5 15 10 20 Q15 25 20 20 Q25 15 20 10 Z" fill="white"/>
      <path d="M20 20 Q30 30 40 40 Q50 50 60 40 Q70 30 60 20" stroke="white" stroke-width="3" fill="none"/>
      <circle cx="60" cy="20" r="8" fill="white"/>
    </g>
  </g>
</svg>