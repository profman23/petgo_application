# Render Blueprint — manages petgo-production only.
#
# petgo-staging was created manually in the Render dashboard before this
# Blueprint existed, and is intentionally NOT redeclared here so that
# `render blueprint launch` does not try to create a duplicate. Its
# configuration lives in the Render dashboard for that service.
#
# To re-introduce petgo-staging under Blueprint management later, add a
# matching `- type: web` block above petgo-production.
#
# After importing this repo as a Blueprint, Render will prompt for the
# `sync: false` secrets (DATABASE_URL, EMAIL_PASSWORD, MYFATOORAH_API_KEY,
# TAQNYAT_API_KEY, PERPLEXITY_API_KEY). See SECURITY.md.
services:
  - type: web
    name: petgo-production
    env: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://petgo-production.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_ENABLED
        value: "false"   # Flip to "true" in dashboard after EMAIL_PASSWORD is set
      - key: EMAIL_PASSWORD
        sync: false
      - key: FROM_EMAIL
        value: info@petgo.me
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: resend
      - key: MYFATOORAH_ENABLED
        value: "false"   # Flip to "true" in dashboard after MYFATOORAH_API_KEY is set
      - key: MYFATOORAH_API_KEY
        sync: false
      - key: MYFATOORAH_WEBHOOK_SECRET
        sync: false
      - key: TAQNYAT_ENABLED
        value: "false"
      - key: TAQNYAT_API_KEY
        sync: false
      - key: PERPLEXITY_ENABLED
        value: "false"
      - key: PERPLEXITY_API_KEY
        sync: false
