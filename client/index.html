<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <title>VetsVan - العيادة البيطرية المتنقلة</title>
    <meta name="description" content="خدمة العيادة البيطرية المتنقلة - رعاية شاملة لحيواناتك الأليفة في منزلك" />
    <meta name="theme-color" content="#852085" />
    <meta name="author" content="VetsVan Team" />
    <meta name="keywords" content="طبيب بيطري، حيوانات أليفة، رعاية صحية، العيادة المتنقلة، VetsVan" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Force Icon Refresh -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/jpeg" href="/app-icon-v6.jpeg" />
    <link rel="icon" type="image/jpeg" sizes="32x32" href="/app-icon-v6.jpeg" />
    <link rel="icon" type="image/jpeg" sizes="16x16" href="/app-icon-v6.jpeg" />
    <link rel="apple-touch-icon" href="/app-icon-v6.jpeg" />
    <link rel="apple-touch-icon" sizes="152x152" href="/app-icon-v6.jpeg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icon-v6.jpeg" />
    
    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VetsVan" />
    
    <!-- Microsoft Windows -->
    <meta name="msapplication-TileImage" content="/app-icon-v6.jpeg" />
    <meta name="msapplication-TileColor" content="#852085" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vetsvan.replit.app/" />
    <meta property="og:title" content="VetsVan - العيادة البيطرية المتنقلة" />
    <meta property="og:description" content="خدمة العيادة البيطرية المتنقلة - رعاية شاملة لحيواناتك الأليفة" />
    <meta property="og:image" content="/app-icon-v6.jpeg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://vetsvan.replit.app/" />
    <meta property="twitter:title" content="VetsVan - العيادة البيطرية المتنقلة" />
    <meta property="twitter:description" content="خدمة العيادة البيطرية المتنقلة - رعاية شاملة لحيواناتك الأليفة" />
    <meta property="twitter:image" content="/app-icon-v6.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then((registration) => {
            console.log('SW registered: ', registration);
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
      }
    </script>
  </body>
</html>
