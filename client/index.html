<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    
    <!-- Force Cache Refresh - Auto Update -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="app-version" content="2.1.0" />
    
    <!-- PWA Meta Tags -->
    <title>PetGo - العيادة البيطرية المتنقلة</title>
    <meta name="description" content="خدمة العيادة البيطرية المتنقلة - رعاية شاملة لحيواناتك الأليفة في منزلك" />
    <meta name="theme-color" content="#1E50C8" />
    <meta name="author" content="PetGo Team" />
    <meta name="keywords" content="طبيب بيطري، حيوانات أليفة، رعاية صحية، العيادة المتنقلة، PetGo" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/icons/final-favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/final-favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/final-favicon.png" />
    <link rel="apple-touch-icon" href="/icons/final-favicon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/final-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/final-favicon.png" />
    
    <!-- Mobile Web App Capabilities - Modern Standard -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Apple Mobile Web App - iOS Specific -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PetGo" />
    <meta name="apple-touch-fullscreen" content="yes" />
    
    <!-- Microsoft Windows -->
    <meta name="msapplication-TileImage" content="/icons/final-favicon.png" />
    <meta name="msapplication-TileColor" content="#1E50C8" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://petgo.replit.app/" />
    <meta property="og:title" content="PetGo - العيادة البيطرية المتنقلة" />
    <meta property="og:description" content="خدمة العيادة البيطرية المتنقلة - رعاية شاملة لحيواناتك الأليفة" />
    <meta property="og:image" content="/icons/final-favicon.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://petgo.replit.app/" />
    <meta property="twitter:title" content="PetGo - العيادة البيطرية المتنقلة" />
    <meta property="twitter:description" content="خدمة العيادة البيطرية المتنقلة - رعاية شاملة لحيواناتك الأليفة" />
    <meta property="twitter:image" content="/icons/final-favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Force reload CSS with timestamp for cache busting
      const timestamp = Date.now();
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = '/src/index.css?v=' + timestamp;
      document.head.appendChild(link);
    </script>
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
