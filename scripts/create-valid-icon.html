<!DOCTYPE html>
<html>
<head>
    <title>Create Valid PWA Icon</title>
</head>
<body>
    <canvas id="canvas" width="512" height="512" style="border: 1px solid #000;"></canvas>
    <br>
    <button onclick="downloadIcon()">Download Icon</button>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Create a professional veterinary icon
        function createIcon() {
            // Clear canvas
            ctx.clearRect(0, 0, 512, 512);
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 512, 512);
            gradient.addColorStop(0, '#852085');
            gradient.addColorStop(1, '#a855f7');
            
            // Draw rounded rectangle background
            const radius = 100;
            ctx.beginPath();
            ctx.roundRect(0, 0, 512, 512, radius);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw medical cross
            ctx.fillStyle = 'white';
            
            // Vertical bar
            ctx.fillRect(206, 76, 100, 360);
            
            // Horizontal bar  
            ctx.fillRect(76, 206, 360, 100);
            
            // Add rounded corners to cross
            ctx.beginPath();
            ctx.roundRect(206, 76, 100, 360, 20);
            ctx.fill();
            
            ctx.beginPath();
            ctx.roundRect(76, 206, 360, 100, 20);
            ctx.fill();
            
            // Add pet silhouettes
            ctx.fillStyle = '#852085';
            ctx.globalAlpha = 0.8;
            
            // Dog silhouette (left side)
            ctx.beginPath();
            ctx.ellipse(180, 230, 25, 35, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(190, 200, 20, 25, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(170, 185, 8, 12, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            // Cat silhouette (right side)
            ctx.beginPath();
            ctx.ellipse(332, 280, 22, 30, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(322, 255, 18, 22, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            // Cat ears
            ctx.beginPath();
            ctx.ellipse(315, 235, 6, 8, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(329, 235, 6, 8, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.globalAlpha = 1;
            
            // Add VetsVan text
            ctx.fillStyle = 'white';
            ctx.font = 'bold 36px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('VetsVan', 256, 460);
            
            ctx.font = 'bold 20px Arial, sans-serif';
            ctx.fillText('Mobile Veterinary', 256, 485);
        }
        
        function downloadIcon() {
            const link = document.createElement('a');
            link.download = 'app-icon.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Create the icon when page loads
        createIcon();
    </script>
</body>
</html>
